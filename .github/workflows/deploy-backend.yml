name: Deploy Backend   # 워크플로우 이름

on:
  push:
    branches: ["main"]   # dev 브랜치에 push될 때 자동 실행
  release:
    types: ["published"]  # Release 발행 시에도 실행
  workflow_dispatch:       # 수동 실행 버튼 활성화
    inputs:
      no_cache:
        description: '캐시 없이 강제로 새로 빌드하겠습니까?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # GitHub Actions 실행 환경 (Ubuntu)

    env:   # 전체 Job에서 사용되는 환경 변수
      IMAGE_NAME: gsc-portal-backend
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # ======================================================
      # 1) GitHub 저장소 코드 체크아웃
      # ======================================================
      - name: Checkout code
        uses: actions/checkout@v4



      # ======================================================
      # 2) Docker Buildx 설정
      #    (멀티 플랫폼 빌드 및 고급 기능 활성화)
      # ======================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 필수: BRANCH / SHORT_SHA 설정
      - name: Extract Git metadata
        run: |
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "APP_VERSION=${GITHUB_REF##*/}-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ======================================================
      # 3) DockerHub 로그인 (푸시를 위해 필요)
      # ======================================================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ======================================================
      # 4) Docker 이미지 빌드 + DockerHub 푸시
      #    - mac/ARM → Linux/AMD64 서버 호환 위해 멀티플랫폼 빌드 필요
      #    - latest 및 sha 기반 버전 태그 생성
      #    - registry 캐시 사용 (빌드 속도 향상)
      # ======================================================
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true

          # 체크박스에 체크하면 true, 아니면 false
          no-cache: ${{ inputs.no_cache }}
          platforms: linux/amd64,linux/arm64
          tags: |
            sgwar/gsc-portal-backend:latest
            sgwar/gsc-portal-backend:${{ env.BRANCH }}-${{ env.SHORT_SHA }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=registry,ref=sgwar/gsc-portal-backend:buildcache
          cache-to: type=registry,ref=sgwar/gsc-portal-backend:buildcache,mode=max


      # ======================================================
      # 5) SSH로 학교 서버 접속 → Docker 배포 실행
      #
      #   기능:
      #   ✔ 새 이미지 pull (속도/불안정성 대비)
      #   ✔ backend 컨테이너만 재시작 (no-deps)
      #   ✔ 불필요 이미지 자동 정리 (디스크 보호)
      #   ✔ < /dev/null → SSH 비대화식 오류 방지
      # ======================================================
#      - name: Deploy to School Server
#        uses: appleboy/ssh-action@v1.0.3
#        with:
#          host: ${{ secrets.SSH_HOST }}
#          username: ${{ secrets.SSH_USER }}
#          key: ${{ secrets.SSH_KEY }}
#          script: |
#            echo "🚀 Deploying BACKEND to School Server..."
#
#            cd ~/gsc-portal-infra   # 서버의 프로젝트 인프라 폴더로 이동
#
#            sudo docker compose -f docker-compose.prod.yml pull gsc_backend < /dev/null
#
#            sudo docker compose -f docker-compose.prod.yml up -d --no-deps gsc_backend < /dev/null
#
#            sudo docker image prune -f < /dev/null
#
#            echo "✅ Deployment to School Server complete!"


      # ======================================================
      # 6) Health Check (배포 후 서비스 정상동작 검증)
      #
      #   기능:
      #   ✔ /health 엔드포인트 호출하여 서버 상태 확인
      #   ✔ Redis / DB / CPU 등 내부 헬스체크 모두 반영
      #   ✔ curl -f → HTTP 200이 아니면 배포 실패 처리
      # ======================================================
      - name: Health check after deploy (dev)
        run: |
          echo "Health check on ${{ secrets.HEALTHCHECK_URL }}"
          curl -f ${{ secrets.HEALTHCHECK_URL }}
